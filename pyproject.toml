[project]
authors = [{name = "Mohamed Hedi Rhouma", email = "mohhedi.rhouma@gmail.com"}]
dependencies = []
name = "cyclegan"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
cyclegan = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.5.5,<3"
earthengine-api = ">=1.7.52,<2"
requests = ">=2.34.2,<3"
rasterio = ">=1.5.2,<2"
pytorch = ">=2.14.1,<3"
pytorch-lightning = ">=2.6.6,<3"
hydra-core = ">=1.3.7,<2"
matplotlib = ">=3.11.2,<4"
einops = ">=0.8.2,<0.9"
tensorboard = ">=2.21.0,<3"
